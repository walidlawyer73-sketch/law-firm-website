<div class="language-switcher">
    <a href="#" class="lang-btn" id="langSwitch"><i class="fas fa-globe"></i> English</a>
</div>

<script>
(function() {
    const langLink = document.getElementById('langSwitch');
    if (!langLink) return;
    const currentPath = window.location.pathname;
    // إذا كنا في صفحة عربية (المسار يبدأ بـ /ar/)
    if (currentPath.startsWith('/ar/')) {
        let englishPath = currentPath.replace('/ar', '');
        if (englishPath === '' || englishPath === '/index.html' || englishPath === '/') {
            englishPath = '/';
        }
        langLink.href = englishPath;
    } else {
        // لو الصفحة مش عربية لأي سبب، نوجه للإنجليزية الرئيسية
        langLink.href = '/';
    }
})();
</script>
<script>
  // ==================== حل مشكلة زر اللغة (سويشر) ====================
document.addEventListener('DOMContentLoaded', function() {
    // نبحث عن زر اللغة - نفترض أنه داخل عنصر يحمل كلاس language-switcher
    const langSwitcher = document.querySelector('.language-switcher');
    if (!langSwitcher) return;

    const langLink = langSwitcher.querySelector('a');
    if (!langLink) return;

    const currentPath = window.location.pathname;

    // التحقق: هل نحن في صفحة عربية؟
    if (currentPath.startsWith('/ar/')) {
        // نحن في صفحة عربية -> نريد رابط النسخة الإنجليزية
        let englishPath = currentPath.replace('/ar/', '/');
        // إذا كان المسار بعد الحذف فارغاً، نذهب للصفحة الرئيسية
        if (englishPath === '' || englishPath === '/') {
            englishPath = '/';
        }
        langLink.href = englishPath;
        langLink.classList.remove('arabic');
        langLink.innerHTML = '<i class="fas fa-globe"></i> English';
    } else {
        // نحن في صفحة إنجليزية -> نريد رابط النسخة العربية
        let arabicPath;
        if (currentPath === '/' || currentPath === '') {
            arabicPath = '/ar/';
        } else {
            arabicPath = '/ar' + currentPath;
        }
        langLink.href = arabicPath;
        langLink.classList.add('arabic');
        langLink.innerHTML = '<i class="fas fa-globe"></i> العربية';
    }
});
