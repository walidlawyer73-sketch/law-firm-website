<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Walid Abo Al-Ela Law Firm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="language-switcher">
        <a href="/ar/contact.html" class="lang-btn arabic"><i class="fas fa-globe"></i> العربية</a>
    </div>

    <!-- نفس النافبار -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">...</nav>

    <header class="page-header">
        <div class="container text-white text-center">
            <h1 class="display-4">Contact Us</h1>
            <p class="lead">We're here to help. Send us a message and we'll respond within 24 hours.</p>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h2>Get in Touch</h2>
                    <form id="contactForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name *</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone">
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message *</label>
                            <textarea class="form-control" id="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                        <div id="formStatus" class="mt-3"></div>
                    </form>
                </div>
                <div class="col-md-6">
                    <h2>Contact Information</h2>
                    <ul class="list-unstyled">
                        <li class="mb-3"><i class="fas fa-map-marker-alt me-2 text-primary"></i> العاشر من رمضان، القاهرة، مصر</li>
                        <li class="mb-3"><i class="fas fa-phone me-2 text-primary"></i> 01111257219</li>
                        <li class="mb-3"><i class="fas fa-envelope me-2 text-primary"></i> walidlegal.ippro@gmail.com</li>
                        <li class="mb-3"><i class="fas fa-clock me-2 text-primary"></i> Sat - Thu: 9am - 8pm</li>
                    </ul>
                    <div class="map mt-4">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3456.7890!2d31.0000!3d30.0000!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDAwJzAwLjAiTiAzMcKwMDAnMDAuMCJF!5e0!3m2!1sen!2seg!4v1234567890" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>...</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            // هنا يمكنك إضافة كود لإرسال النموذج إلى البريد الإلكتروني أو قاعدة بيانات
            alert('Thank you for your message. We will contact you soon.');
            this.reset();
        });
    </script>
</body>
</html>
