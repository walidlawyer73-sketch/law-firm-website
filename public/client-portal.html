<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - Walid Abo Al-Ela Law Firm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="language-switcher">
        <a href="/ar/client-portal.html" class="lang-btn arabic"><i class="fas fa-globe"></i> العربية</a>
    </div>

    <!-- نفس النافبار -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">...</nav>

    <header class="page-header">
        <div class="container text-white text-center">
            <h1 class="display-4">Client Portal</h1>
            <p class="lead">Secure access to your case information and documents.</p>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="fas fa-lock me-2"></i>Login</h4>
                        </div>
                        <div class="card-body p-4">
                            <form>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username / Email</label>
                                    <input type="text" class="form-control" id="username" placeholder="Enter your username">
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">Remember me</label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                            <hr>
                            <div class="text-center">
                                <a href="#" class="text-muted">Forgot password?</a>
                            </div>
                        </div>
                    </div>
                    <p class="text-center mt-4">Don't have an account? <a href="contact.html">Contact us</a> to request access.</p>
                </div>
            </div>
        </div>
    </section>

    <footer>...</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
